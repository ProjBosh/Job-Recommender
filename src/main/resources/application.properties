spring.application.name=job-tracking

#Connecting to the database
spring.datasource.url=jdbc:postgresql://localhost:5432/job_tracking
spring.datasource.username=admin_job_tracking
spring.datasource.password=job_tracking_password
spring.datasource.driver-class-name=org.postgresql.Driver

#Settings JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PosgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true